
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURENYA | Checkout</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0c;
            color: #f5f2eb;
            font-family: 'DM Sans', sans-serif;
        }

        nav {
            padding: 25px 8%;
            border-bottom: 1px solid #292929;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 27px;
            letter-spacing: 3px;
            color: #d6b477;
        }

        nav a {
            color: #d6b477;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            margin-bottom: 35px;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 23px;
            margin-bottom: 22px;
            color: #e0c18a;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 35px;
        }

        .section {
            background: #141415;
            border: 1px solid #292929;
            padding: 28px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #c9c5bb;
        }

        input, select {
            width: 100%;
            padding: 13px;
            background: #202021;
            border: 1px solid #393939;
            border-radius: 5px;
            color: white;
            font-family: inherit;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #d6b477;
        }

        select option {
            background: #202021;
        }

        .same-address {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0 22px;
            color: #c9c5bb;
            font-size: 14px;
        }

        .same-address input {
            width: auto;
            accent-color: #d6b477;
        }

        .summary {
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 18px 0;
            color: #c9c5bb;
        }

        .total {
            border-top: 1px solid #393939;
            padding-top: 20px;
            font-size: 19px;
            color: #e0c18a;
            font-weight: 600;
        }

        .place-order {
            width: 100%;
            padding: 15px;
            background: #d6b477;
            color: #111;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .place-order:hover {
            background: #e0c18a;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }

        @media(max-width: 750px) {
            .checkout-layout {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">SURENYA</div>
    <a href="/cart">← Back to Cart</a>
</nav>

<div class="container">

    <h1>Checkout</h1>

    <div class="checkout-layout">

        <div>

            <!-- Billing Address -->
            <div class="section">
                <h2>Billing Address</h2>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="billing_name" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="billing_phone" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Address</label>
                        <input type="text" id="billing_address" required>
                    </div>

                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="billing_city" required>
                    </div>

                    <div class="form-group">
                        <label>State</label>
                        <input type="text" id="billing_state" required>
                    </div>

                    <div class="form-group">
                        <label>Pincode</label>
                        <input type="text" id="billing_pincode" required>
                    </div>

                </div>
            </div>

            <!-- Delivery Address -->
            <div class="section">
                <h2>Delivery Address</h2>

                <label class="same-address">
                    <input type="checkbox" id="same_address" checked>
                    Same as billing address
                </label>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="delivery_name" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="delivery_phone" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Address</label>
                        <input type="text" id="delivery_address" required>
                    </div>

                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="delivery_city" required>
                    </div>

                    <div class="form-group">
                        <label>State</label>
                        <input type="text" id="delivery_state" required>
                    </div>

                    <div class="form-group">
                        <label>Pincode</label>
                        <input type="text" id="delivery_pincode" required>
                    </div>

                </div>
            </div>

            <!-- Payment -->
            <div class="section">
                <h2>Payment Method</h2>

                <div class="form-group">
                    <label>Select Payment Method</label>

                    <select id="payment_method" required>
                        <option value="">Choose Payment Method</option>
                        <option value="UPI">UPI (Dummy)</option>
                        <option value="Card">Credit / Debit Card (Dummy)</option>
                        <option value="COD">Cash on Delivery</option>
                    </select>
                </div>
            </div>

        </div>

        <!-- Order Summary -->
        <div class="section summary">

            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Total Items</span>
                <span id="total_items">0</span>
            </div>

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">₹0.00</span>
            </div>

            <div class="summary-row">
                <span>Delivery</span>
                <span>Free</span>
            </div>

            <div class="summary-row total">
                <span>Total Amount</span>
                <span id="total_amount">₹0.00</span>
            </div>

            <button class="place-order" onclick="placeOrder()">
                Place Order
            </button>

            <p id="message"></p>

        </div>

    </div>
</div>

<script>

    const USER_ID = 1;

    // Load cart summary
    async function loadSummary() {

        const response = await fetch(`/api/cart?user_id=${USER_ID}`);
        const data = await response.json();

        const items = data.items || [];

        let totalItems = 0;
        let totalAmount = 0;

        items.forEach(item => {
            totalItems += Number(item.quantity);
            totalAmount += Number(item.subtotal);
        });

        document.getElementById("total_items").innerText = totalItems;
        document.getElementById("subtotal").innerText = "₹" + totalAmount.toFixed(2);
        document.getElementById("total_amount").innerText = "₹" + totalAmount.toFixed(2);
    }

    // Copy billing address to delivery address
    document.getElementById("same_address").addEventListener("change", function () {

        const fields = [
            "name", "phone", "address", "city", "state", "pincode"
        ];

        if (this.checked) {
            fields.forEach(field => {
                document.getElementById("delivery_" + field).value =
                    document.getElementById("billing_" + field).value;
            });
        }

    });

    // Place Order
    async function placeOrder() {

        const billing = {
            name: document.getElementById("billing_name").value,
            phone: document.getElementById("billing_phone").value,
            address: document.getElementById("billing_address").value,
            city: document.getElementById("billing_city").value,
            state: document.getElementById("billing_state").value,
            pincode: document.getElementById("billing_pincode").value
        };

        // Copy billing details when same address is selected
        if (document.getElementById("same_address").checked) {
            const fields = ["name", "phone", "address", "city", "state", "pincode"];

            fields.forEach(field => {
                document.getElementById("delivery_" + field).value =
                    document.getElementById("billing_" + field).value;
            });
        }

        const delivery = {
            name: document.getElementById("delivery_name").value,
            phone: document.getElementById("delivery_phone").value,
            address: document.getElementById("delivery_address").value,
            city: document.getElementById("delivery_city").value,
            state: document.getElementById("delivery_state").value,
            pincode: document.getElementById("delivery_pincode").value
        };

        const payment_method = document.getElementById("payment_method").value;

        if (!payment_method) {
            alert("Please select a payment method");
            return;
        }

        if (!document.querySelector("input#billing_name").value ||
            !document.querySelector("input#billing_phone").value ||
            !document.querySelector("input#billing_address").value ||
            !document.querySelector("input#billing_city").value ||
            !document.querySelector("input#billing_state").value ||
            !document.querySelector("input#billing_pincode").value ||
            !delivery.name || !delivery.phone || !delivery.address ||
            !delivery.city || !delivery.state || !delivery.pincode) {
            alert("Please fill all address details");
            return;
        }

        for (const [url, address] of [
            ["/api/billing-address", billing],
            ["/api/delivery-address", delivery]
        ]) {
            const addressResponse = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_id: USER_ID,
                    address: address
                })
            });

            if (!addressResponse.ok) {
                const error = await addressResponse.json();
                document.getElementById("message").innerText =
                    error.error || "Unable to save address";
                return;
            }
        }

        const response = await fetch("/api/order/place", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                user_id: USER_ID,
                billing: billing,
                delivery: delivery,
                payment_method: payment_method
            })
        });

        const result = await response.json();

        if (response.ok) {
            alert(
                "Order placed successfully!\n" +
                "Order ID: " + result.order_id +
                "\nTransaction ID: " + result.transaction_id
            );

            window.location.href = "/orders";
        } else {
            document.getElementById("message").innerText =
                result.error || "Unable to place order";
        }
    }

    loadSummary();

</script>

</body>
</html>
