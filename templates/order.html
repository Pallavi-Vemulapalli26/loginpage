
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURENYA | My Orders</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0c;
            color: #f5f2eb;
            font-family: 'DM Sans', sans-serif;
        }

        nav {
            padding: 25px 8%;
            border-bottom: 1px solid #292929;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 27px;
            letter-spacing: 3px;
            color: #d6b477;
        }

        nav a {
            color: #d6b477;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            margin-bottom: 30px;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: #e0c18a;
            margin-bottom: 18px;
        }

        .order-card, .details-section {
            background: #141415;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .order-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-label {
            color: #999;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .info-value {
            color: #f5f2eb;
            font-weight: 600;
        }

        .status {
            color: #d6b477;
        }

        button {
            padding: 11px 20px;
            background: #d6b477;
            color: #111;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #e0c18a;
        }

        .details-section {
            display: none;
            margin-top: 30px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .detail-box {
            background: #202021;
            border: 1px solid #393939;
            border-radius: 7px;
            padding: 18px;
            line-height: 1.8;
            color: #c9c5bb;
        }

        .detail-box strong {
            color: #e0c18a;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #393939;
            color: #c9c5bb;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            color: #e0c18a;
            font-size: 19px;
            font-weight: 600;
        }

        #message {
            color: #c9c5bb;
            margin-top: 20px;
        }

        @media(max-width: 750px) {
            .order-info {
                grid-template-columns: 1fr 1fr;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">SURENYA</div>
    <a href="/products">Continue Shopping</a>
</nav>

<div class="container">

    <h1>My Orders</h1>

    <div id="ordersList"></div>
    <p id="message"></p>

    <div class="details-section" id="orderDetails">
        <h2>Order Details</h2>

        <div id="detailsContent"></div>
    </div>

</div>

<script>

    const USER_ID = 1;

    // Load all orders
    async function loadOrders() {

        const response = await fetch(`/api/orders/${USER_ID}`);
        const data = await response.json();

        const orders = data.orders || [];
        const ordersList = document.getElementById("ordersList");

        ordersList.innerHTML = "";

        if (orders.length === 0) {
            document.getElementById("message").innerText =
                "You have not placed any orders yet.";
            return;
        }

        document.getElementById("message").innerText = "";

        orders.forEach(order => {

            ordersList.innerHTML += `
                <div class="order-card">

                    <div class="order-info">

                        <div>
                            <p class="info-label">Order ID</p>
                            <p class="info-value">#${order.cart_order_id}</p>
                        </div>

                        <div>
                            <p class="info-label">Order Date</p>
                            <p class="info-value">${order.created_at}</p>
                        </div>

                        <div>
                            <p class="info-label">Total Amount</p>
                            <p class="info-value">₹${Number(order.total_amount).toFixed(2)}</p>
                        </div>

                        <div>
                            <p class="info-label">Order Status</p>
                            <p class="info-value status">${order.order_status}</p>
                        </div>

                    </div>

                    <button onclick="viewOrder(${order.cart_order_id})">
                        View Details
                    </button>

                </div>
            `;
        });
    }


    // View individual order details
    async function viewOrder(orderId) {

        const response = await fetch(`/api/order/${orderId}/${USER_ID}`);
        const data = await response.json();

        if (!response.ok) {
            alert(data.error || "Unable to load order details");
            return;
        }

        const order = data.order;
        const items = data.items || [];
        const payment = data.payment || {};

        let itemsHTML = "";

        items.forEach(item => {
            itemsHTML += `
                <div class="item-row">
                    <span>
                        ${item.product_name} × ${item.quantity}
                    </span>
                    <span>
                        ₹${Number(item.subtotal).toFixed(2)}
                    </span>
                </div>
            `;
        });

        document.getElementById("detailsContent").innerHTML = `

            <div class="details-grid">

                <div class="detail-box">
                    <strong>Billing Address</strong><br>
                    ${order.billing_name}<br>
                    ${order.billing_phone}<br>
                    ${order.billing_address}<br>
                    ${order.billing_city}, ${order.billing_state}<br>
                    ${order.billing_pincode}
                </div>

                <div class="detail-box">
                    <strong>Delivery Address</strong><br>
                    ${order.delivery_name}<br>
                    ${order.delivery_phone}<br>
                    ${order.delivery_address}<br>
                    ${order.delivery_city}, ${order.delivery_state}<br>
                    ${order.delivery_pincode}
                </div>

            </div>

            <h2>Ordered Products</h2>

            ${itemsHTML}

            <div class="total-row">
                <span>Total Amount</span>
                <span>₹${Number(order.total_amount).toFixed(2)}</span>
            </div>

            <br>

            <div class="detail-box">
                <strong>Payment Details</strong><br>
                Payment Method: ${payment.payment_method || "N/A"}<br>
                Transaction ID: ${payment.transaction_id || "N/A"}<br>
                Payment Status: ${payment.payment_status || "N/A"}
            </div>
        `;

        const details = document.getElementById("orderDetails");
        details.style.display = "block";

        details.scrollIntoView({
            behavior: "smooth"
        });
    }

    loadOrders();

</script>

</body>
</html>
