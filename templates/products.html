
<!DOCTYPE html>
<html>
<head>
    <title>My Products</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        form {
            text-align: center;
            margin: 30px;
        }

        input {
            padding: 12px;
            width: 300px;
        }

        button {
            padding: 12px;
            background: blue;
            color: white;
            border: none;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            width: 220px;
            border-radius: 10px;
        }

        img {
            width: 100%;
            height: 150px;
            object-fit: contain;
        }

        .price {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>My Products</h1>

<form action="/products" method="GET">
    <input
        type="text"
        name="q"
        value="{{ search }}"
        placeholder="Electronics under 10000"
    >

    <button type="submit">Search</button>
</form>

<div class="products">

    {% for p in products %}

    <div class="card">

        <img
            src="{{ url_for('static',
            filename='products/' + p['image']) }}"
            onerror="this.style.display='none'"
        >

        <h3>{{ p['product_name'] }}</h3>

        <p>{{ p['category_name'] }}</p>

        <p class="price">₹{{ p['price'] }}</p>

        <p>{{ p['product_description'] }}</p>

    </div>

    {% else %}

    <p>No products found.</p>

    {% endfor %}

</div>

</body>
</html>
