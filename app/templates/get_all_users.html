<!DOCTYPE html>
<html>
<head>
    <title>Users</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #333;
            color: white;
        }

        tr:hover {
            background: #f1f1f1;
        }

        button {
            padding: 7px 12px;
            margin-right: 5px;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }

        button:first-child {
            background: #2878d7;
        }

        button:last-child {
            background: #d9363e;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <table>
        <thead>
            <tr>
                
                <th>Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="usersTable"></tbody>
    </table>

    <script>
        async function loadUsers() {
            try {
                const response = await fetch("http://127.0.0.1:5000/all_users");

                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const users = await response.json();

                console.log("API response:", users);

                const table = document.getElementById("usersTable");

                table.innerHTML = "";

                users.forEach(user => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td>
                            <button onclick="editUser(${user.id}, '${user.username}')">Edit</button>
                            <button onclick="deleteUser(${user.id})">Delete</button>
                        </td>
                    `;

                    table.appendChild(row);
                });

            } catch (error) {
                console.error("Error loading users:", error);
            }
        }

        loadUsers();




        async function editUser(userId, currentUsername) {
            const newUsername = prompt(
                "Enter the new username:",
                currentUsername
            );

            if (!newUsername || newUsername === currentUsername) {
                return;
            }

            const response = await fetch(
                "http://127.0.0.1:5000/update-user",
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        id: userId,
                        new_username: newUsername
                    })
                }
            );

            const result = await response.text();
            alert(result);

            if (response.ok) {
                loadUsers();
            }
        }

        async function deleteUser(userId) {
            const confirmed = confirm("Delete this user?");

            if (!confirmed) {
                return;
            }

            const response = await fetch(
                "http://127.0.0.1:5000/delete-user",
                {
                    method: "DELETE",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        id: userId
                    })
                }
            );

            const result = await response.text();
            alert(result);

            if (response.ok) {
                loadUsers();
            }
        }
    </script>

</body>
</html>
